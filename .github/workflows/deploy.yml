name: Docs y GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1) Generar JSDoc en la carpeta "documentacion" y guardarla en el repo
      - run: npm install
      - run: npm run docs
      - name: Commit de la documentación
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add documentacion
          git diff --staged --quiet || git commit -m "docs: actualizar JSDoc"
          git push

      # 2) Publicar en Pages SOLO la web (sin la carpeta de documentación)
      - name: Preparar sitio
        run: |
          mkdir public
          cp index.html estilos.css script.js public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4