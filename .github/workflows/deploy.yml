name: Docs y GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar JSDoc
        run: npx --yes jsdoc script.js -d documentacion

      - name: Guardar documentación en el repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add documentacion
          git diff --staged --quiet || git commit -m "docs: actualizar JSDoc"
          git push

  deploy:
    needs: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Preparar sitio
        run: |
          mkdir public
          cp index.html styles.css script.js public/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
